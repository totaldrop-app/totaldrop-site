# Copyright and license annotations for files that cannot carry them in a
# comment (HTML pages, images, fonts, avatars, JSON catalogs, and docs).
# Source files carry their own SPDX lines; both are verified in CI by
# `tools/check-spdx.sh` and `reuse lint` (REUSE 3.3).
version = 1

# Everything not listed below: the web site's license.
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 The TotalDrop Contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Shared localization status and ICU/negotiation test vectors synced from
# upstream `l10n/`.
[[annotations]]
path = "vendor/l10n/**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 The TotalDrop Contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# Self-hosted SIL Open Font License 1.1 fonts (with license texts beside them).
[[annotations]]
path = [
  "public/fonts/atkinson-*",
  "public/fonts/LICENSE-atkinson-hyperlegible.txt",
]
precedence = "override"
SPDX-FileCopyrightText = "2020 Braille Institute of America, Inc."
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = [
  "public/fonts/bricolage-*",
  "public/fonts/LICENSE-bricolage-grotesque.txt",
]
precedence = "override"
SPDX-FileCopyrightText = "2022 The Bricolage Grotesque Project Authors"
SPDX-License-Identifier = "OFL-1.1"

# Team profile avatars: each person's own GitHub profile picture, shown with
# their permission (LICENSES/LicenseRef-TotalDrop-Team-Avatars.txt).
[[annotations]]
path = "public/team/avatars/**"
precedence = "override"
SPDX-FileCopyrightText = "The person each picture shows"
SPDX-License-Identifier = "LicenseRef-TotalDrop-Team-Avatars"
