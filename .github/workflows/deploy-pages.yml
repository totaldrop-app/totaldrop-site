# Deploys totaldrop.app to Cloudflare Pages directly from totaldrop-site/main
# once all 35-language, privacy, asset, and security checks pass and the
# protected `cloudflare` environment approves the deployment.
name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - public/**
      - functions/**
      - wrangler.toml
      - tools/probe-site.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify site before deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Run full site and 35-language verification suite
        run: |
          node --check public/app.js
          node --check public/lang.js
          node --check public/msg.js
          node --check functions/_middleware.js
          node --check tools/probe-site.mjs
          node tools/asset-versions.mjs --check
          node tools/privacy.mjs --check
          node tools/static-locales.mjs --check
          node tools/check-i18n.mjs
          node tools/favicons.mjs
          node tools/brand-files.mjs
          node tools/team.mjs
          node tools/check-readmes.mjs
          node --test tools/test-*.mjs

  deploy:
    name: Deploy totaldrop.app Pages
    needs: verify
    if: >-
      needs.verify.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || vars.CLOUDFLARE_DEPLOY_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare
    concurrency:
      group: deploy-site
      cancel-in-progress: false
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install pinned Wrangler without lifecycle scripts
        run: npm install --prefix "$RUNNER_TEMP/wrangler" --no-save --ignore-scripts wrangler@4.160.0
      - name: Deploy Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          "$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler" pages deploy public
          --project-name totaldrop --branch main
          --commit-hash "$GITHUB_SHA" --commit-dirty=false
      - name: Post-deploy health probe
        run: node tools/probe-site.mjs
